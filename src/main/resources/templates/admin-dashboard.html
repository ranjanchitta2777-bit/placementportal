<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">Admin Dashboard</h2>

    <!-- Statistics -->

    <div class="row">

        <div class="col-md-3">
            <div class="card text-white bg-primary shadow">
                <div class="card-body text-center">
                    <h1 th:text="${studentCount}">0</h1>
                    <h5>Total Students</h5>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-success shadow">
                <div class="card-body text-center">
                    <h1 th:text="${companyCount}">0</h1>
                    <h5>Companies</h5>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-warning shadow">
                <div class="card-body text-center">
                    <h1 th:text="${applicationCount}">0</h1>
                    <h5>Applications</h5>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-danger shadow">
                <div class="card-body text-center">
                    <h1 th:text="${selectedCount}">0</h1>
                    <h5>Selected</h5>
                </div>
            </div>
        </div>

    </div>

    <!-- Quick Actions -->

    <!-- Quick Actions -->

<div class="card shadow mt-4">

    <div class="card-header bg-dark text-white">
        Quick Actions
    </div>

    <div class="card-body">

        <a href="/admin/add-company" class="btn btn-success me-2 mb-2">
            ➕ Add Company
        </a>

        <a href="/admin/companies" class="btn btn-primary me-2 mb-2">
            📋 View Companies
        </a>

        <a href="/admin/applications" class="btn btn-warning me-2 mb-2">
            📄 View Applications
        </a>

    </div>

</div>

<!-- Administration -->
<div class="card shadow mt-4"
     th:if="${admin.role == 'SUPER_ADMIN'}">

    <div class="card-header bg-primary text-white">
        Administration
    </div>

    <div class="card-body">

        <a href="/admin/add-admin"
           class="btn btn-primary me-2">
            👤 Add Admin
        </a>

        <a href="/admin/admin-list"
           class="btn btn-secondary">
            👥 View Admins
        </a>

    </div>

</div>

    <!-- Students -->

    <h3 class="mt-4">Student Management</h3>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Branch</th>
<th>CGPA</th>
<th>Action</th>

        </tr>

        </thead>

        <tbody>

<tr th:each="student : ${students}">

    <td th:text="${student.id}"></td>
    <td th:text="${student.name}"></td>
    <td th:text="${student.email}"></td>
    <td th:text="${student.branch}"></td>
    <td th:text="${student.cgpa}"></td>

    <td>
        <a th:href="@{/admin/delete-student/{id}(id=${student.id})}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('Are you sure you want to delete this student?');">
            Delete
        </a>
    </td>

</tr>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
