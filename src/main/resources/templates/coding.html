<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Coding Preparation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center text-primary mb-4">
        💻 Coding Preparation
    </h1>

    <p class="text-center text-muted">
        Select a topic to start practicing.
    </p>

    <div class="row">

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>Arrays</h4>
                    <button class="btn btn-primary mt-3">Start</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>Strings</h4>
                    <button class="btn btn-primary mt-3">Start</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>Linked List</h4>
                    <button class="btn btn-primary mt-3">Start</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>Stack</h4>
                    <button class="btn btn-primary mt-3">Start</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>Queue</h4>
                    <button class="btn btn-primary mt-3">Start</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>Recursion</h4>
                    <button class="btn btn-primary mt-3">Start</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>Binary Search</h4>
                    <button class="btn btn-primary mt-3">Start</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>Trees</h4>
                    <button class="btn btn-primary mt-3">Start</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>Graphs</h4>
                    <button class="btn btn-primary mt-3">Start</button>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">

        <a th:href="@{/}" class="btn btn-secondary">
            ⬅ Back to Home
        </a>

    </div>

</div>

</body>
</html>
