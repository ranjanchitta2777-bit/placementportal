<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Student Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">
        Student Applications
    </h2>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Student</th>
            <th>Email</th>
            <th>Company</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="a : ${applications}">

            <td th:text="${a.id}"></td>

            <td th:text="${a.studentName}"></td>

            <td th:text="${a.studentEmail}"></td>

            <td th:text="${a.companyName}"></td>

            <td th:text="${a.role}"></td>

            <td>

                <span class="badge"
                      th:class="${a.status == 'Selected'} ? 'badge bg-success' :
                                (${a.status == 'Rejected'} ? 'badge bg-danger' : 'badge bg-warning')"
                      th:text="${a.status}">
                </span>

            </td>

            <td>

                <div th:if="${a.status == 'Pending'}">

                    <form th:action="@{/admin/select/{id}(id=${a.id})}"
                          method="post"
                          style="display:inline;">

                        <button type="submit" class="btn btn-success btn-sm">
                            Select
                        </button>

                    </form>

                    <form th:action="@{/admin/reject/{id}(id=${a.id})}"
                          method="post"
                          style="display:inline;">

                        <button type="submit" class="btn btn-danger btn-sm">
                            Reject
                        </button>

                    </form>

                </div>

                <div th:unless="${a.status == 'Pending'}">

                    <span class="text-muted">Completed</span>

                </div>

            </td>

        </tr>

        </tbody>

    </table>

    <a href="/admin/dashboard" class="btn btn-primary">
        Back to Dashboard
    </a>

</div>

</body>

</html>
