<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resume Preview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
        }

        .resume-card{
            max-width:900px;
            margin:40px auto;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        h2{
            color:#0d6efd;
            margin-bottom:30px;
        }

        h5{
            margin-top:25px;
            color:#444;
        }

        p{
            white-space:pre-line;
        }
    </style>
</head>

<body>

<div class="resume-card">

    <h2 th:text="${student.name}">Student Name</h2>

    <hr>

    <p><b>Email:</b> <span th:text="${student.email}"></span></p>
    <p><b>Phone:</b> <span th:text="${student.phone}"></span></p>
    <p><b>College:</b> <span th:text="${student.college}"></span></p>
    <p><b>Branch:</b> <span th:text="${student.branch}"></span></p>
    <p><b>CGPA:</b> <span th:text="${student.cgpa}"></span></p>
    <p><b>Skills:</b> <span th:text="${student.skills}"></span></p>

    <h5>Career Objective</h5>
    <p th:text="${resume.objective}"></p>

    <h5>Projects</h5>
    <p th:text="${resume.projects}"></p>

    <h5>Certifications</h5>
    <p th:text="${resume.certifications}"></p>

    <h5>Achievements</h5>
    <p th:text="${resume.achievements}"></p>

    <h5>Languages</h5>
    <p th:text="${resume.languages}"></p>

    <h5>Declaration</h5>
    <p th:text="${resume.declaration}"></p>

</div>

</body>
</html>
