<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold">
            Placement Portal
        </a>

        <a th:href="@{/dashboard}" class="btn btn-light">
            Dashboard
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3>Edit Profile</h3>

                </div>

                <div class="card-body">

                    <form th:action="@{/update-profile}"
                          th:object="${student}"
                          method="post">

                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-3">

                            <label>Name</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}">

                        </div>

                        <div class="mb-3">

                            <label>Email</label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   readonly>

                        </div>

                        <div class="mb-3">

                            <label>Phone</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{phone}">

                        </div>

                        <div class="mb-3">

                            <label>College</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{college}">

                        </div>

                        <div class="mb-3">

                            <label>Branch</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{branch}">

                        </div>

                        <div class="mb-3">

                            <label>CGPA</label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{cgpa}">

                        </div>

                        <div class="mb-3">

                            <label>Skills</label>

                           <div class="mb-3">

    <label class="form-label">Skills</label>

    <input
        type="text"
        class="form-control"
        placeholder="Java, Spring Boot, MySQL, HTML, CSS"
        th:field="*{skills}">

    <small class="text-muted">
        Separate skills using commas.
    </small>

</div>

                        </div>

                        <div class="mb-3">

                            <label>GitHub</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{github}">

                        </div>

                        <div class="mb-3">

                            <label>LinkedIn</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{linkedin}">

                        </div>

                        <div class="mb-3">

                            <label>LeetCode</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{leetcode}">

                        </div>

                        <input type="hidden"
                               th:field="*{password}"/>

                        <button class="btn btn-success w-100">

                            Save Changes

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
