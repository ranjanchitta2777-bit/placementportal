<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Company Drives</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold">
            🏢 Latest Placement Drives
        </a>

        <a th:href="@{/}" class="btn btn-light">
            Home
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-lg-4 mb-4"
             th:each="company : ${companies}">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4 class="text-primary"
                        th:text="${company.companyName}">
                    </h4>

                    <hr>

                    <p>
                        <strong>Role :</strong>
                        <span th:text="${company.role}"></span>
                    </p>

                    <p>
                        <strong>Package :</strong>
                        <span th:text="${company.packageOffered}"></span>
                    </p>

                    <p>
                        <strong>Location :</strong>
                        <span th:text="${company.location}"></span>
                    </p>

                    <p>
                        <strong>Eligibility :</strong>
                        <span th:text="${company.eligibility}"></span>
                    </p>

                    <p>
                        <strong>CGPA :</strong>
                        <span th:text="${company.minCgpa}"></span>
                    </p>

                    <p>
                        <strong>Branch :</strong>
                        <span th:text="${company.eligibleBranch}"></span>
                    </p>

                    <p>
                        <strong>Deadline :</strong>
                        <span th:text="${company.deadline}"></span>
                    </p>

                </div>

                <div class="card-footer text-center">

                    <a th:href="@{/login}"
                       class="btn btn-success w-100">
                        Login to Apply
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
