<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Companies</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <h2>Placement Drives</h2>

    <a href="/admin/add-company"
       class="btn btn-primary mb-3">
        Add Company
    </a>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

 <th>ID</th>
<th>Company</th>
<th>Role</th>
<th>Package</th>
<th>Location</th>
<th>Min CGPA</th>
<th>Branch</th>
<th>Deadline</th>
<th>Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="c : ${companies}">

    <td th:text="${c.id}"></td>

    <td th:text="${c.companyName}"></td>

    <td th:text="${c.role}"></td>

    <td th:text="${c.packageOffered}"></td>

    <td th:text="${c.location}"></td>

    <td th:text="${c.minCgpa}"></td>

    <td th:text="${c.eligibleBranch}"></td>

    <td th:text="${c.deadline}"></td>

    <td>

        <a th:href="@{/admin/edit-company/{id}(id=${c.id})}"
           class="btn btn-warning btn-sm">
            Edit
        </a>

        <a th:href="@{/admin/delete-company/{id}(id=${c.id})}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('Delete this company?')">
            Delete
        </a>

    </td>

</tr>

        </tbody>

    </table>

    <a href="/admin/dashboard" class="btn btn-secondary">
        Back
    </a>

</div>

</body>
</html>
