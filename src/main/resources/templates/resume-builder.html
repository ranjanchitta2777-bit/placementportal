<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Resume Builder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h2>Professional Resume Builder</h2>

</div>

<div class="card-body">

<form th:action="@{/saveResume}"
      th:object="${resume}"
      method="post">

<input type="hidden" th:field="*{id}">

<h4 class="mb-3">Basic Information</h4>

<div class="row">

<div class="col-md-6 mb-3">

<label>Name</label>

<input class="form-control"
       th:value="${student.name}"
       readonly>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input class="form-control"
       th:value="${student.email}"
       readonly>

</div>

<div class="col-md-6 mb-3">

<label>Phone</label>

<input class="form-control"
       th:value="${student.phone}"
       readonly>

</div>

<div class="col-md-6 mb-3">

<label>College</label>

<input class="form-control"
       th:value="${student.college}"
       readonly>

</div>

<div class="col-md-6 mb-3">

<label>Branch</label>

<input class="form-control"
       th:value="${student.branch}"
       readonly>

</div>

<div class="col-md-6 mb-3">

<label>CGPA</label>

<input class="form-control"
       th:value="${student.cgpa}"
       readonly>

</div>

</div>

<hr>

<h4>Career Objective</h4>

<textarea class="form-control mb-4"
          rows="4"
          th:field="*{objective}">
</textarea>

<h4>Projects</h4>

<textarea class="form-control mb-4"
          rows="6"
          th:field="*{projects}">
</textarea>

<h4>Certifications</h4>

<textarea class="form-control mb-4"
          rows="4"
          th:field="*{certifications}">
</textarea>

<h4>Achievements</h4>

<textarea class="form-control mb-4"
          rows="4"
          th:field="*{achievements}">
</textarea>

<h4>Languages</h4>

<input class="form-control mb-4"
       th:field="*{languages}">

<h4>Declaration</h4>

<textarea class="form-control mb-4"
          rows="3"
          th:field="*{declaration}">
</textarea>

<div class="text-center">

<button class="btn btn-success btn-lg">
Save Resume
</button>

<a th:href="@{/resume-preview}"
   class="btn btn-primary btn-lg ms-2">
Preview Resume
</a>

</div>

</form>

</div>

</div>

</div>

</body>
</html>
