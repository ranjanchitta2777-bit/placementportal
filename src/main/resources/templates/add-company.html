<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Add Company</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Add Placement Drive</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/admin/add-company}"
                  th:object="${company}"
                  method="post">

                <input class="form-control mb-3"
                       th:field="*{companyName}"
                       placeholder="Company Name">

                <input class="form-control mb-3"
                       th:field="*{role}"
                       placeholder="Role">

                <input class="form-control mb-3"
                       th:field="*{packageOffered}"
                       placeholder="Package (e.g. 6 LPA)">

                <input class="form-control mb-3"
                       th:field="*{location}"
                       placeholder="Location">

                <input class="form-control mb-3"
                       th:field="*{eligibility}"
                       placeholder="Eligibility (e.g. No Active Backlogs)">

                <!-- NEW FIELD -->
                <input type="number"
                       step="0.01"
                       class="form-control mb-3"
                       th:field="*{minCgpa}"
                       placeholder="Minimum CGPA">

                <!-- NEW FIELD -->
                <input class="form-control mb-3"
                       th:field="*{eligibleBranch}"
                       placeholder="Eligible Branch (e.g. CSE)">

                <input type="date"
                       class="form-control mb-4"
                       th:field="*{deadline}">

                <button class="btn btn-success w-100">
                    Add Company
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
